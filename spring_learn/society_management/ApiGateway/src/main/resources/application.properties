spring.application.name=ApiGateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8083/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=members
spring.cloud.gateway.server.webflux.routes[1].uri=lb://members
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/members/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=society
spring.cloud.gateway.server.webflux.routes[2].uri=lb://society
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/society/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1